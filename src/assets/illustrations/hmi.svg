<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" aria-hidden="true" focusable="false">
  <!-- Generic operator panel: status bar, gauges, tank levels, trend and controls. Not a real system layout. -->
  <rect x="18" y="18" width="324" height="24" rx="5" style="fill: var(--surface); stroke: var(--hairline); stroke-width: 1" />
  <rect x="28" y="28" width="56" height="4" rx="2" style="fill: var(--border-strong)" />
  <circle cx="310" cy="30" r="4" style="fill: var(--success)" />
