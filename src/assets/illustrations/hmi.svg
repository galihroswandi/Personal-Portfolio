  <rect x="146" y="110" width="28" height="7" rx="2" style="fill: var(--ink-subtle)" />

  <rect x="222" y="56" width="28" height="70" rx="4" style="fill: var(--surface); stroke: var(--hairline); stroke-width: 1" />
  <rect class="ill-bar" x="225" y="76" width="22" height="47" rx="2" style="fill: var(--border-strong); --i: 0" />
  <rect x="262" y="56" width="28" height="70" rx="4" style="fill: var(--surface); stroke: var(--hairline); stroke-width: 1" />
  <rect class="ill-bar" x="265" y="100" width="22" height="23" rx="2" style="fill: var(--accent); --i: 1" />
  <rect x="302" y="56" width="28" height="70" rx="4" style="fill: var(--surface); stroke: var(--hairline); stroke-width: 1" />
