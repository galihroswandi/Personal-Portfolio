  <rect x="226" y="152" width="36" height="5" rx="2.5" style="fill: var(--on-accent)" />
  <rect x="282" y="140" width="60" height="29" rx="5" style="fill: none; stroke: var(--border-strong); stroke-width: 1" />
  <rect x="294" y="152" width="36" height="5" rx="2.5" style="fill: var(--border-strong)" />
  <rect x="214" y="177" width="60" height="29" rx="5" style="fill: none; stroke: var(--border-strong); stroke-width: 1" />
  <rect x="226" y="189" width="36" height="5" rx="2.5" style="fill: var(--border-strong)" />
  <rect x="282" y="177" width="60" height="29" rx="5" style="fill: none; stroke: var(--border-strong); stroke-width: 1" />
  <rect x="294" y="189" width="36" height="5" rx="2.5" style="fill: var(--border-strong)" />
