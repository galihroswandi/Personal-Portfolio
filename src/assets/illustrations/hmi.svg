  <rect x="18" y="140" width="186" height="66" rx="5" style="fill: var(--surface); stroke: var(--hairline); stroke-width: 1" />
  <polyline class="ill-trace" points="28,190 52,180 76,186 100,166 124,172 148,158 172,164 194,150" pathLength="1" style="fill: none; stroke: var(--success); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 1" />

