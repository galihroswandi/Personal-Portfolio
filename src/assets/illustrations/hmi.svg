  <path d="M36 118 A34 34 0 0 1 104 118" style="fill: none; stroke: var(--hairline); stroke-width: 7; stroke-linecap: round" />
  <path class="ill-trace" d="M36 118 A34 34 0 0 1 90 90.5" pathLength="1" style="fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 1" />
  <rect x="56" y="110" width="28" height="7" rx="2" style="fill: var(--ink-subtle)" />
